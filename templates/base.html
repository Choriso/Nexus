<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='src/layouts/base.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://api-maps.yandex.ru/2.0/?load=package.standard&amp;lang=ru-RU&amp;apikey=<dda3ddba-c9ea-4ead-9010-f43fbc15c6e3>"
            type="text/javascript"></script>
    <script src="{{ url_for('static', filename='geolocation_ip.js') }}"></script>
</head>
<body class="app-root">
{% if not hide_header %}
<header class="app-header">
    <div class="app-header__container">
        <a class="app-header__brand" href="/intereses">NEXUS</a>
        <nav class="app-header__nav">
            <a class="btn-primary" href="/chat">Чат</a>
            <a class="btn-primary" href="/profile">Профиль</a>
        </nav>
    </div>
</header>
{% endif %}

<main role="main" class="app-main">
    {% block content %}{% endblock %}
</main>
<footer></footer>

<!-- Global loading overlay -->
<div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99999;align-items:center;justify-content:center;flex-direction:column;">
    <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.2);border-top-color:var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;color:#fff;font-size:16px;" id="loadingText">Загрузка...</div>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
(function(){
    var overlay = document.getElementById('loadingOverlay');
    var loadingText = document.getElementById('loadingText');
    var LOADER_DELAY = 300;
    var _loadingCount = 0;
    var _linkTimer = null;

    function _showAfterDelay(msg) {
        if (_linkTimer) clearTimeout(_linkTimer);
        _linkTimer = setTimeout(function() {
            _loadingCount++;
            loadingText.textContent = msg;
            overlay.style.display = 'flex';
            _linkTimer = null;
        }, LOADER_DELAY);
    }

    function _hideIfDone() {
        _loadingCount = Math.max(0, _loadingCount - 1);
        if (_loadingCount === 0) {
            overlay.style.display = 'none';
        }
    }

    window.showLoading = function(msg) {
        msg = msg || 'Загрузка...';
        if (_linkTimer) clearTimeout(_linkTimer);
        _loadingCount++;
        loadingText.textContent = msg;
        overlay.style.display = 'flex';
    };
    window.hideLoading = function() {
        _hideIfDone();
    };
    window.forceHideLoading = function() {
        if (_linkTimer) clearTimeout(_linkTimer);
        _loadingCount = 0;
        overlay.style.display = 'none';
    };

    // Ссылки — с задержкой
    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link) return;
        if (link.hasAttribute('data-no-loader')) return;
        if (link.hasAttribute('download')) return;
        var href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href === '') return;
        _showAfterDelay('Переход...');
    }, true);

    // fetch — с задержкой
    var origFetch = window.fetch;
    window._fetchTimer = null;
    window.fetch = function() {
        var args = arguments;
        var url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
        if (url.includes('/health')) {
            return origFetch.apply(this, args);
        }
        if (window._fetchTimer) clearTimeout(window._fetchTimer);
        window._fetchTimer = setTimeout(function() {
            _loadingCount++;
            loadingText.textContent = 'Загрузка...';
            overlay.style.display = 'flex';
        }, LOADER_DELAY);
        return origFetch.apply(this, args).then(function(resp) {
            if (window._fetchTimer) {
                clearTimeout(window._fetchTimer);
                window._fetchTimer = null;
            } else {
                _hideIfDone();
            }
            return resp;
        }).catch(function(err) {
            if (window._fetchTimer) {
                clearTimeout(window._fetchTimer);
                window._fetchTimer = null;
            } else {
                _hideIfDone();
            }
            throw err;
        });
    };
})();
</script>
</body>
</html>
