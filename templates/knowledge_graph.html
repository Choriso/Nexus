{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="{{ url_for('static', filename='js/graph_editor.js', v=graph_js_version) }}"></script>

<style>
    #graph-container {
        background: #16161a; /* Глубокий темный фон в стиле Obsidian */
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid #242629;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }
    .node-circle {
        stroke: #16161a;
        stroke-width: 2px;
        transition: r 0.3s ease;
    }
    .node:hover .node-circle {
        r: 12px; /* Увеличиваем при наведении */
    }
    .node-label {
        fill: #94a1b2;
        font-size: 13px;
        pointer-events: none;
        font-family: 'Inter', system-ui, sans-serif;
    }
    .link {
        stroke: #444b5a;
        stroke-opacity: 0.4;
        stroke-width: 1.5px;
    }
    .controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    /* Кнопки в стиле современного UI */
    .btn-ui {
        background: #7f5af0;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
    }

    .btn-ui:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(127, 90, 240, 0.3); }

    .graphCanvas {
        cursor: grab; /* Показывает "руку" при наведении на пустую область */
    }

    .graphCanvas:active {
        cursor: grabbing; /* Показывает сжатый кулак при перетаскивании */
    }

    .node text {
        pointer-events: none; /* Текст не перехватывает клики, они проходят сквозь него на узел */
        user-select: none;
    }
</style>

<div style="max-width: 1400px; margin: 20px auto; padding: 0 20px;">
    <h1 style="color: #fffffe; text-align: center; font-weight: 800; margin-bottom: 20px;">Граф Знаний</h1>

    <div id="graph-container">
        <svg id="graphCanvas" data-username="{{ current_user.name }}" style="cursor: grab" width="100%" height="650"></svg>
        <div class="controls">
            <button class="btn-ui" onclick="addNode()">+ Узел</button>
            <button class="btn-ui" style="background: #2cb67d;" onclick="saveGraphPositions()">Сохранить</button>
        </div>
        <div id="nodeModal"
             style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: #393D54; border: 2px solid white; border-radius: 16px; padding: 24px; max-width: 500px; width: 90%;">
                <h2 style="color: white; margin-bottom: 20px;">Редактировать узел</h2>

                <input type="text" id="nodeTitle" placeholder="Название"
                       style="width: 100%; padding: 10px; margin-bottom: 12px; background: #232533; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">

                <textarea id="nodeDescription" placeholder="Описание" rows="4"
                          style="width: 100%; padding: 10px; margin-bottom: 12px; background: #232533; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; resize: vertical;"></textarea>

                <select id="nodeCategory"
                        style="width: 100%; padding: 10px; margin-bottom: 12px; background: #232533; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                    <option value="">Без категории</option>
                    <option value="work">Работа</option>
                    <option value="hobby">Хобби</option>
                    <option value="want">Что хочу</option>
                    <option value="skills">Навыки</option>
                    <option value="goals">Цели</option>
                </select>

                <div style="display: flex; gap: 12px;">
                    <button onclick="saveNode()"
                            style="flex: 1; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        Сохранить
                    </button>
                    <button onclick="deleteNode()"
                            style="padding: 12px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        Удалить
                    </button>
                    <button onclick="closeModal()"
                            style="padding: 12px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        Отмена
                    </button>
                </div>

            </div>
        </div>

    </div>
</div>
<script>
window.addEventListener('load', () => {
    const nodesData = {{ nodes|tojson|safe }};
    const connectionsData = {{ connections|tojson|safe }};
    const currentUserName = "{{ current_user.name }}";

    console.log("[KnowledgeGraph] nodesData:", nodesData);
    console.log("[KnowledgeGraph] connectionsData:", connectionsData);

    if (typeof initGraph === 'function') {
        initGraph(nodesData, connectionsData, currentUserName);
    } else {
        console.error("Критическая ошибка: initGraph не найдена!");
    }
});
</script>


{% endblock %}
