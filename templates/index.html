{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
{# FIX: cache-busting — браузер не будет подавать старый JS из кэша #}
<script src="{{ url_for('static', filename='js/graph_editor.js') }}?v={% block js_version %}2{% endblock %}"></script>

<style>
    /* ── Graph page layout ── */
    .graph-layout-active {
        display: grid;
        grid-template-columns: 1fr 350px;
        height: calc(100vh - 100px);
        overflow: hidden;
    }

    #graph-container {
        background: var(--color-bg-deep);
        border-radius: var(--radius-md);
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow-graph);
        border: 1px solid var(--color-border-panel);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    .app-main-grid__side {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-height: 80vh;
        background: var(--color-bg-deep);
        border-radius: var(--radius-md);
        border: 1px solid var(--color-border-panel);
        padding: 15px;
    }

    .side-panel-header {
        display: flex;
        flex-shrink: 0;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--color-border-panel);
    }
    .side-panel-header h3 {
        color: var(--color-text-heading);
        margin: 0;
        font-size: 0.95rem;
    }
    .badge {
        color: var(--color-text-heading);
        font-weight: 700;
    }

    #resultsList {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 8px;
    }
    #resultsList::-webkit-scrollbar       { width: 5px; }
    #resultsList::-webkit-scrollbar-track { background: transparent; }
    #resultsList::-webkit-scrollbar-thumb { background: var(--color-accent-purple); border-radius: 10px; }

    .placeholder-text {
        color: var(--color-text-muted);
        font-size: 0.85rem;
        padding: 24px 12px;
        text-align: center;
    }

    /* ── Floating AI Toast ── */
    .ai-toast {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 9999;
        width: 380px;
        max-width: calc(100vw - 48px);
        background: var(--color-card);
        border: 1px solid var(--color-accent-purple-glow);
        border-radius: 12px;
        box-shadow: var(--shadow-toast), 0 0 24px rgba(127, 90, 240, 0.12);
        transform: translateY(calc(100% + 24px));
        opacity: 0;
        transition: transform 0.35s cubic-bezier(0.32, 0, 0.25, 1), opacity 0.3s ease;
        pointer-events: none;
    }
    .ai-toast.visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
    }
    .ai-toast__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 8px;
        color: var(--color-text-heading);
        font-weight: 700;
        font-size: 0.9rem;
    }
    .ai-toast__header-left {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .ai-toast__glow-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--color-accent-purple);
        box-shadow: 0 0 8px var(--color-accent-purple);
        animation: pulseGlow 2s ease-in-out infinite;
    }
    .ai-toast__close {
        background: none; border: none;
        color: var(--color-text-soft);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0 4px;
        line-height: 1;
    }
    .ai-toast__close:hover { color: var(--color-text-heading); }
    .ai-toast__body {
        padding: 0 16px 16px;
        color: var(--color-toast-text);
        font-size: 0.85rem;
        line-height: 1.55;
        min-height: 2em;
    }
    .ai-toast__body .tw-cursor {
        display: inline-block;
        width: 2px; height: 1em;
        background: var(--color-accent-purple);
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blinkCursor 0.9s step-end infinite;
    }

    /* ── Candidate card ── */
    .match-card {
        background: var(--color-card);
        border: 1px solid var(--color-border-soft);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .match-card:hover {
        border-color: var(--color-accent-purple);
        box-shadow: 0 0 0 1px rgba(127, 90, 240, 0.15);
    }

    .match-card-header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .match-score {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--color-text-heading);
        background: var(--color-accent-purple);
        padding: 4px 8px;
        border-radius: 5px;
        min-width: 36px;
        text-align: center;
        flex-shrink: 0;
        line-height: 1.3;
    }

    .match-info {
        flex: 1;
        min-width: 0;
    }

    .match-name {
        color: var(--color-text-heading);
        font-weight: 600;
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .match-actions {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
    }
    .match-actions .btn-primary {
        padding: 4px 8px;
        font-size: 0.72rem;
        white-space: nowrap;
        line-height: 1.3;
    }
    .btn-ai {
        background: var(--color-accent-purple-bg);
        border: 1px solid rgba(127, 90, 240, 0.35);
        color: var(--color-ai-text);
    }
    .btn-ai:hover {
        background: rgba(127, 90, 240, 0.25);
        color: var(--color-text-heading);
    }

    /* ── Tags row ── */
    .match-tags-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
        min-height: 0;
    }
    .match-tag {
        background: var(--color-success-bg);
        color: var(--color-success);
        font-size: 0.65rem;
        padding: 1px 6px;
        border-radius: 3px;
        border: 1px solid var(--color-success-border);
    }
    .match-tag-more {
        background: none;
        border: 1px dashed rgba(44, 182, 125, 0.3);
        color: var(--color-success);
        font-size: 0.65rem;
        padding: 1px 6px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .match-tag-more:hover {
        background: var(--color-success-bg);
    }
    .match-tags-extra {
        display: none;
        gap: 4px;
        flex-wrap: wrap;
    }
    .match-tags-extra.open {
        display: flex;
    }

    @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.85); }
    }
    @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ── Graph ── */
    .node circle { transition: r 0.2s ease; }
    .node:hover circle { r: 12px; }
    .node text {
        fill: var(--color-node-text);
        font-size: 13px;
        pointer-events: none;
        user-select: none;
        font-family: var(--font-sans-alt);
    }
    line {
        stroke: var(--color-node-stroke);
        stroke-opacity: 0.4;
        stroke-width: 1.5px;
    }
    .controls {
        position: absolute;
        top: 20px; right: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    #graphCanvas          { cursor: grab;    display: block; }
    #graphCanvas:active   { cursor: grabbing; }

    .btn-danger {
        background: var(--color-danger) !important;
        border-color: #b71c1c !important;
    }
    .btn-cancel {
        background: #444 !important;
        border-color: #555 !important;
    }

    /* ── Modal ── */
    #nodeModal {
        display: none;
        position: fixed; inset: 0;
        background: var(--color-overlay);
        z-index: 9999;
        align-items: center;
        justify-content: center;
    }
    .modal-box {
        background: var(--color-modal-bg);
        padding: 24px;
        border-radius: 16px;
        width: 420px;
        max-width: 95vw;
        border: 1px solid var(--color-modal-border);
        box-shadow: var(--shadow-graph);
        box-sizing: border-box;
    }
    .modal-box h2 {
        color: var(--color-text-heading);
        margin: 0 0 20px;
    }
    .modal-body { display: flex; flex-direction: column; gap: 12px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
</style>

<div class="app-main-grid graph-layout-active">
    <section class="app-main-grid__main">
        <div id="graph-wrapper" style="position: relative;">
            <div id="graph-container">
                <svg id="graphCanvas"
                     width="100%" height="617"
                     data-username="{{ current_user.username | e }}">
                </svg>
                <div class="controls">
                    <button class="btn-primary" onclick="window.addNode()">Создать узел</button>
                </div>
            </div>
        </div>
    </section>

    <aside class="app-main-grid__side" id="matchResultsSide">
        <div class="side-panel-header">
            <h3>Подходящие люди: </h3>
            <span id="matchCount" class="badge">0</span>
        </div>
        <div id="resultsList">
            <div class="placeholder-text">Нажмите на узел графа, чтобы найти единомышленников</div>
        </div>
    </aside>

    <!-- Floating AI Review Toast (bottom-left) -->
    <div class="ai-toast" id="aiToast">
        <div class="ai-toast__header">
            <div class="ai-toast__header-left">
                <span class="ai-toast__glow-dot"></span>
                Nexus AI — Анализ
            </div>
            <button class="ai-toast__close" onclick="closeAiToast()" aria-label="Закрыть">✕</button>
        </div>
        <div class="ai-toast__body" id="aiToastBody">
            Выберите кандидата и нажмите «Анализ ИИ»
        </div>
    </div>
</div>

<div id="nodeModal">
    <div class="modal-box">
        <h2 id="modalTitle">Новый интерес</h2>
        <div class="modal-body">
            <input type="text" id="nodeTitle" class="ui-input" placeholder="Название"
                   style="width:100%; box-sizing:border-box;">

            <textarea id="nodeDescription" class="ui-input" placeholder="Описание"
                      style="width:100%; box-sizing:border-box; resize:none; overflow:hidden; min-height:80px;"
                      oninput="this.style.height=''; this.style.height=this.scrollHeight+'px'"></textarea>

            <select id="nodeCategory" class="ui-input" style="width:100%; box-sizing:border-box;">
                <option value="hobby">Хобби</option>
                <option value="work">Работа</option>
                <option value="psychology">Психология</option>
            </select>

            <div class="modal-actions">
                <button onclick="window.saveNode()" class="btn-primary" style="flex:2; white-space:nowrap;">Сохранить
                </button>
                <button id="deleteBtn" onclick="window.deleteNode()" class="btn-primary btn-danger"
                        style="flex:1; white-space:nowrap; display:none;">
                    Удалить
                </button>
                <button onclick="window.closeModal()" class="btn-primary btn-cancel"
                        style="flex:1; white-space:nowrap;">
                    Отмена
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    window._editingNodeId = null;

    // --- ФУНКЦИИ УПРАВЛЕНИЯ УЗЛАМИ ---
    window.addNode = function() {
        window._editingNodeId = null;
        document.getElementById('nodeTitle').value = '';
        document.getElementById('nodeDescription').value = '';
        document.getElementById('modalTitle').textContent = 'Новый интерес';
        document.getElementById('deleteBtn').style.display = 'none';
        document.getElementById('nodeModal').style.display = 'flex';
    };

    window.openEditModal = function(d) {
        window._editingNodeId = String(d.id);
        document.getElementById('nodeTitle').value = d.title || '';
        document.getElementById('nodeDescription').value = d.description || '';
        document.getElementById('nodeCategory').value = d.category || 'hobby';
        document.getElementById('modalTitle').textContent = 'Редактировать';
        document.getElementById('deleteBtn').style.display = 'block';
        document.getElementById('nodeModal').style.display = 'flex';
    };

    window.saveNode = async function() {
        const id = window._editingNodeId;
        const payload = {
            title: document.getElementById('nodeTitle').value,
            description: document.getElementById('nodeDescription').value,
            category: document.getElementById('nodeCategory').value,
            x: 0, y: 0
        };

        const url = id ? `/knowledge_graph/node/${id}` : '/knowledge_graph/node';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) location.reload();
    };

    window.deleteNode = async function() {
        const id = window._editingNodeId;
        if (!id) return;
        if (!confirm('Вы уверены, что хотите удалить этот интерес?')) return;

        try {
            const res = await fetch(`/knowledge_graph/node/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });

            if (res.ok) {
                window.closeModal();
                location.reload();
            } else {
                alert("Не удалось удалить узел. Ошибка сервера: " + res.status);
            }
        } catch (err) {
            alert("Ошибка при отправке запроса на удаление.");
        }
    };

    window.closeModal = () => document.getElementById('nodeModal').style.display = 'none';

    function _esc(str) {
        return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let _typewriterTimer = null;

    function typewriterRender(element, text, options = {}) {
        if (_typewriterTimer) {
            clearTimeout(_typewriterTimer);
            _typewriterTimer = null;
        }
        const safeText = String(text ?? '');
        const mode = options.mode || 'word';
        const delay = options.delay || (mode === 'char' ? 18 : 42);
        const showCursor = options.cursor !== false;

        element.textContent = '';
        if (!safeText) return;

        const units = mode === 'char'
            ? safeText.split('')
            : safeText.split(/(\s+)/);

        let index = 0;
        const cursor = document.createElement('span');
        cursor.className = 'tw-cursor';
        element.appendChild(cursor);

        const tick = () => {
            if (index >= units.length) {
                if (!showCursor) cursor.remove();
                return;
            }
            cursor.before(document.createTextNode(units[index]));
            index += 1;
            _typewriterTimer = setTimeout(tick, delay);
        };
        tick();
    }

    let _activeToastUser = null;
    let _activeToastNode = null;

    function closeAiToast() {
        const toast = document.getElementById('aiToast');
        toast.classList.remove('visible');
        _activeToastUser = null;
        _activeToastNode = null;
    }

    window.showAiReport = async function(targetUserId, nodeId) {
        const toast = document.getElementById('aiToast');
        const body = document.getElementById('aiToastBody');

        _activeToastUser = targetUserId;
        _activeToastNode = nodeId;
        toast.classList.add('visible');

        body.textContent = '⚡ Анализируем совместимость...';

        try {
            const res = await fetch(`/api/graph/report/${targetUserId}?node_id=${nodeId}`);
            if (!res.ok) throw new Error("Server Error");

            const data = await res.json();
            const reportText = data.report || 'Не удалось сформировать отчет.';

            body.textContent = '';
            typewriterRender(body, reportText, { mode: 'word', delay: 38 });
        } catch (err) {
            console.error("AI Report error:", err);
            body.textContent = '';
            typewriterRender(body, 'Анализ совместимости завершен. У вас есть общие интересы для хорошего общения.', { mode: 'word', delay: 30 });
        }
    };

    window.addEventListener('load', () => {
        const canvas = document.getElementById('graphCanvas');
        const userName = canvas.dataset.username || "Я";

        fetch('/knowledge_graph_data')
            .then(res => res.json())
            .then(data => {
                if (typeof initGraph === 'function') {
                    initGraph(data.nodes, data.connections, userName);
                }
            });

        // Основная функция поиска кандидатов
        window.onNodeClick = async function(nodeId) {
            const list = document.getElementById('resultsList');
            const badge = document.getElementById('matchCount');
            closeAiToast();
            list.innerHTML = '<div class="placeholder-text">Поиск в графе...</div>';

            try {
                const res = await fetch(`/api/graph/match/${nodeId}`);
                const data = await res.json();

                badge.textContent = data.length || 0;
                if (!data.length) {
                    list.innerHTML = '<div class="placeholder-text">Совпадений не найдено</div>';
                    return;
                }

                // Рендерим карточки
                list.innerHTML = data.map((m, idx) => {
                    const tags = m.matched_tags || [];
                    const extraTags = tags.slice(1);
                    const moreId = `more-tags-${idx}`;

                    let tagsRowHtml = '';
                    if (tags.length > 0) {
                        const firstTag = _esc(tags[0]);
                        if (extraTags.length === 0) {
                            tagsRowHtml = `<div class="match-tags-row"><span class="match-tag">${firstTag}</span></div>`;
                        } else {
                            const extrasInner = extraTags.map(t => `<span class="match-tag">${_esc(t)}</span>`).join('');
                            tagsRowHtml = `
                                <div class="match-tags-row">
                                    <span class="match-tag">${firstTag}</span>
                                    <span class="match-tag-more" onclick="(function(){
                                        var el=document.getElementById('${moreId}');
                                        el.classList.toggle('open');
                                        this.style.display='none';
                                    })()">+ещё ${extraTags.length}</span>
                                    <span class="match-tags-extra" id="${moreId}">${extrasInner}</span>
                                </div>`;
                        }
                    }

                    return `
                        <div class="match-card">
                            <div class="match-card-header">
                                <div class="match-score">${m.compatibility}%</div>
                                <div class="match-info">
                                    <span class="match-name">${_esc(m.user_name)}</span>
                                </div>
                                <div class="match-actions">
                                    <button class="btn-primary" onclick="location.href='/viewProfile?user_id=${m.user_id}'">Профиль</button>
                                    <button class="btn-primary btn-ai" onclick="showAiReport(${m.user_id}, ${nodeId})">Анализ ИИ</button>
                                </div>
                            </div>
                            ${tagsRowHtml}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                list.innerHTML = '<div class="placeholder-text" style="color: #e53935;">Ошибка поиска</div>';
            }
        };
    });
</script>
{% endblock %}
