<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интересы</title>
    <link href="https://fonts.googleapis.com/css?family=Geist+Mono&display=swap" rel="stylesheet">
    <link href="/static/CSS/interestStyle.css" rel="stylesheet">
</head>
<body>

        <div class="container">
            <span class="left-item" href="#" >Connectify</span>
            <div class="center-items">
                <a class="btn" href="/chat">Чат</a>
                <a class="btn" href="/profile">Профиль</a>
                <a class="btn" href="/interest">Создать интерес</a>

            </div>
        </div>
        <div class="search-container">
                    <input type="text" id="search" class="search-input" placeholder="Введите запрос" style="width: 100%;     height: 40px;">
                    <button class="btn">Найти</button>
        </div>
        <nav class="container_1">
            <a class="btn" href="/intereses">Все</a>
            <button class="btn" onclick="alert('Функция в разработке')">Рекомендуется</button>
            {% if current_user.is_authenticated %}
            <a class="btn" href="/favorites">Понравившиеся</a>
            {% else %}
            <button class="btn" onclick="alert('Войдите, чтобы видеть понравившиеся интересы')">Понравившиеся</button>
            {% endif %}
        </nav>
        <div style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
        {% for item in interest %}
                <div class="interest-card" style="margin-top: 20px; background: #393D54; border: 2px solid white; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 16px rgba(0,0,0,0.3)'" onmouseout="this.style.transform=''; this.style.boxShadow=''">
                    <div class="interest-header" style="display: flex; align-items: center; gap: 16px;">
                        <a href="/viewProfile?user_id={{ item.user.id }}" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
                            <img src="{% if item.user.image_path %}{{ url_for('static', filename=item.user.image_path) if not item.user.image_path.startswith('http') else item.user.image_path }}{% else %}{{ url_for('static', filename='images/default-avatar.svg') }}{% endif %}" 
                                 alt="{{ item.user.name }}" 
                                 style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; object-fit: cover; background: #232533;"
                                 onerror="this.src='{{ url_for('static', filename='images/default-avatar.svg') }}'">
                            <div class="Text" style="font-weight: bold; font-size: 20px; color: white;">
                                {{item.user.name}} - {{item.title}}
                            </div>
                        </a>
                    </div>
                    <div class="Preview"
                         style="padding: 16px; background: #232533; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);">
                        <div class="Text" style="color: #d1d7dd; word-wrap: break-word; line-height: 1.6;">
                            {{item.description}}
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px; align-items: center; justify-content: space-between;">
                        <a href="/viewInteres?user_id={{ item.user.id }}&interest_id={{ item.id }}" style="text-decoration: none;">
                            <div class="btn" style="padding: 10px 20px; border: 1px solid white; background: transparent; color: white; cursor: pointer; border-radius: 0; transition: all 0.2s;" onmouseover="this.style.background='white'; this.style.color='#393D54'" onmouseout="this.style.background='transparent'; this.style.color='white'">
                                <div class="Text">
                                    Посмотреть
                                </div>
                            </div>
                        </a>
                        {% if current_user.is_authenticated %}
                        <button id="favorite-btn-{{ item.id }}" 
                                class="favorite-btn" 
                                onclick="toggleFavorite({{ item.id }})"
                                style="padding: 10px 20px; border: 1px solid white; background: {% if favorite_ids and item.id in favorite_ids %}#ff6b6b{% else %}transparent{% endif %}; color: white; cursor: pointer; border-radius: 0; transition: all 0.2s; font-size: 20px;"
                                onmouseover="if(!this.classList.contains('favorited')) this.style.background='rgba(255,107,107,0.5)'" 
                                onmouseout="if(!this.classList.contains('favorited')) this.style.background='transparent'">
                            {% if favorite_ids and item.id in favorite_ids %}❤️{% else %}🤍{% endif %}
                        </button>
                        {% endif %}
                    </div>
                </div>
        {% endfor %}
        </div>

<script>
async function toggleFavorite(interestId) {
    const button = document.getElementById(`favorite-btn-${interestId}`);
    if (!button) return;
    
    button.disabled = true;
    const originalContent = button.innerHTML;
    
    try {
        const response = await fetch(`/favorite/${interestId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
        });
        
        const result = await response.json();
        
        if (result.success) {
            if (result.is_favorite) {
                button.innerHTML = '❤️';
                button.classList.add('favorited');
                button.style.background = '#ff6b6b';
            } else {
                button.innerHTML = '🤍';
                button.classList.remove('favorited');
                button.style.background = 'transparent';
            }
        } else {
            alert(result.message || 'Ошибка при изменении избранного');
            button.innerHTML = originalContent;
        }
    } catch (error) {
        console.error('Ошибка:', error);
        alert('Произошла ошибка. Попробуйте ещё раз.');
        button.innerHTML = originalContent;
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
