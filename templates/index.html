{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="{{ url_for('static', filename='js/graph_editor.js') }}"></script>
    <style>
    #graph-container {

        background: #16161a;
        border-radius: var(--radius-md);
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid #242629;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }
    /* Контейнер боковой панели */
    .app-main-grid__side {
        display: flex;
        flex-direction: column;
        height: 100%; /* Занимает всю доступную высоту сетки */
        max-height: 80vh; /* Ограничиваем общую высоту, чтобы не толкало футер */
        background: #16161a;
        border-radius: var(--radius-md);
        border: 1px solid #242629;
        padding: 15px;
    }

    /* Заголовок всегда сверху (не скроллится) */
    .side-panel-header {
        flex-shrink: 0;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #242629;
    }

    /* САМОЕ ВАЖНОЕ: Список результатов со скроллом */
    #resultsList {
        flex-grow: 1; /* Занимает всё оставшееся место */
        overflow-y: auto; /* Включает вертикальную прокрутку */
        padding-right: 8px; /* Место для полосы прокрутки */
    }

    /* Стилизация полосы прокрутки (делаем её красивой) */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #16161a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #7f5af0; /* Фиолетовый под стиль кнопок */
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a1b2;
    }

    /* Стиль карточки (чтобы они не слипались) */
    .match-card {
        background: #242629;
        border: 1px solid #444b5a;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        transition: transform 0.2s;
    }
    .match-card:hover {
        border-color: #7f5af0;
    }

    .node-circle {
        stroke: #16161a;
        stroke-width: 2px;
        transition: r 0.3s ease;
    }
    .node:hover .node-circle {
        r: 12px; /* Увеличиваем при наведении */
    }
    .node-label {
        fill: #94a1b2;
        font-size: 13px;
        pointer-events: none;
        font-family: 'Inter', system-ui, sans-serif;
    }
    .link {
        stroke: #444b5a;
        stroke-opacity: 0.4;
        stroke-width: 1.5px;
    }
    .controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    /* Кнопки в стиле современного UI */


    .btn-ui:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(127, 90, 240, 0.3); }

    .graphCanvas {
        cursor: grab; /* Показывает "руку" при наведении на пустую область */
    }

    .graphCanvas:active {
        cursor: grabbing; /* Показывает сжатый кулак при перетаскивании */
    }

    .node text {
        pointer-events: none; /* Текст не перехватывает клики, они проходят сквозь него на узел */
        user-select: none;
    }
</style>
<div class="app-main-grid graph-layout-active">
    <section class="app-main-grid__main">
        <div class="search-container">
            <form class="search-container__form" onsubmit="event.preventDefault(); smartSearch();">
                <input type="text" id="smartSearchInput" class="ui-input search-input"
                       placeholder="Введите запрос или кликните на узел графа...">
                <button class="btn-primary" type="button" onclick="smartSearch()">Найти</button>
            </form>
        </div>

        <div id="graph-wrapper" style="position: relative;">
            <div id="graph-container">
                <svg id="graphCanvas" width="100%" height="617"></svg>
                <div class="controls">
                    <button class="btn-primary" onclick="addNode()">Создать узел</button>
                </div>
            </div>
        </div>
    </section>

    <aside class="app-main-grid__side" id="matchResultsSide">
        <div class="side-panel-header">
            <h3>Подходящие люди</h3>
            <span id="matchCount" class="badge">0</span>
        </div>
        <div id="resultsList" class="custom-scrollbar">
            <div class="placeholder-text">Нажмите на узел графа, чтобы найти единомышленников</div>
        </div>
    </aside>
</div>

<div id="nodeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: #242629; padding: 20px; border-radius: 12px; width: 400px; border: 1px solid #7f5af0;">
        <h2 style="color: white;">Новый узел</h2>
        <input type="text" id="nodeTitle" placeholder="Название" class="ui-input" style="width: 100%; margin-bottom: 10px;">
        <textarea id="nodeDescription" placeholder="Описание" class="ui-input" style="width: 100%; margin-bottom: 10px;"></textarea>
        <select id="nodeCategory" class="ui-input" style="width: 100%; margin-bottom: 20px;">
            <option value="hobby">Хобби</option>
            <option value="work">Работа</option>
            <option value="want">Цель</option>
        </select>
        <div style="display: flex; gap: 10px;">
            <button onclick="saveNode()" class="btn-primary" style="flex: 1;">Сохранить</button>
            <button onclick="document.getElementById('nodeModal').style.display='none'" class="btn-primary" style="background: #666;">Отмена</button>
        </div>
    </div>
</div>

<script>
// Добавь эту функцию в index.html, чтобы сохранение работало
async function saveNode() {
    const title = document.getElementById('nodeTitle').value;
    const response = await fetch('/knowledge_graph/node', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            title: title,
            description: document.getElementById('nodeDescription').value,
            category: document.getElementById('nodeCategory').value,
            x: 0, y: 0
        })
    });
    if (response.ok) location.reload();
}
window.addEventListener('load', () => {
    // Загружаем данные графа через твой текущий роут
    fetch('/knowledge_graph_data') // Создадим этот легкий эндпоинт ниже
        .then(res => res.json())
        .then(data => {
            initGraph(data.nodes, data.connections);
        });
});

async function smartSearch() {
    const q = document.getElementById('smartSearchInput').value;
    // Логика: если поиск по тексту, подсвечиваем узлы или ищем людей
    const response = await fetch(`/search_api?q=${encodeURIComponent(q)}`);
    const results = await response.json();
    renderMatches(results);
}

function renderMatches(matches) {
    const list = document.getElementById('resultsList');
    list.innerHTML = matches.map(m => `
        <div class="match-card">
            <div class="match-score">${m.compatibility}%</div>
            <div class="match-info">
                <div class="match-name">${m.user_name}</div>
                <div class="match-reason">${m.node_title} (${m.category})</div>
            </div>
            <button class="btn-primary" onclick="location.href='/viewProfile?user_id=${m.user_id}'">Профиль</button>
        </div>
    `).join('');
    document.getElementById('matchCount').innerText = matches.length;
}
</script>
{% endblock %}
