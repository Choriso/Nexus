{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
{# FIX: cache-busting — браузер не будет подавать старый JS из кэша #}
<script src="{{ url_for('static', filename='js/graph_editor.js') }}?v={% block js_version %}2{% endblock %}"></script>

<style>
    #graph-container {
        background: #16161a;
        border-radius: var(--radius-md);
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid #242629;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    .app-main-grid__side {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-height: 80vh;
        background: #16161a;
        border-radius: var(--radius-md);
        border: 1px solid #242629;
        padding: 15px;
    }

    .side-panel-header {
        flex-shrink: 0;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #242629;
    }

    .ai-report-card {
        flex-shrink: 0;
        background: linear-gradient(135deg, rgba(127, 90, 240, 0.12) 0%, rgba(22, 22, 26, 0.95) 60%);
        border: 1px solid rgba(127, 90, 240, 0.45);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
        box-shadow: 0 0 18px rgba(127, 90, 240, 0.15), inset 0 0 24px rgba(127, 90, 240, 0.04);
        display: none;
    }
    .ai-report-card.visible {
        display: block;
        animation: fadeIn 0.35s ease;
    }
    .ai-report-card__header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fffffe;
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 10px;
        text-shadow: 0 0 12px rgba(127, 90, 240, 0.6);
    }
    .ai-report-card__header span.glow-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7f5af0;
        box-shadow: 0 0 8px #7f5af0, 0 0 16px rgba(127, 90, 240, 0.5);
        animation: pulseGlow 2s ease-in-out infinite;
    }
    .ai-report-card__preview {
        color: #94a1b2;
        font-size: 0.88rem;
        line-height: 1.55;
        min-height: 2.4em;
    }
    .ai-report-card__preview .tw-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #7f5af0;
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blinkCursor 0.9s step-end infinite;
    }
    @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.85); }
    }
    @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    #resultsList {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar       { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #16161a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #7f5af0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a1b2; }

    /* Обновленные стили карточки матчинга */
    .match-card {
        background: #242629;
        border: 1px solid #444b5a;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        transition: border-color 0.2s;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
    .match-card:hover { border-color: #7f5af0; }

    .match-card-header {
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
    }

    .match-score {
        font-size: 1.1rem;
        font-weight: bold;
        color: #fffffe;
        background: #7f5af0;
        padding: 6px 10px;
        border-radius: 6px;
        min-width: 45px;
        text-align: center;
    }

    .match-info {
        flex-grow: 1;
    }

    .match-name {
        color: #fffffe;
        font-weight: 600;
        font-size: 1.05rem;
    }

    .match-node {
        color: #94a1b2;
        font-size: 0.85rem;
        margin-top: 2px;
    }

    /* Стили для тегов совпадений */
    .match-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }
    .match-tag {
        background: rgba(44, 182, 125, 0.15);
        color: #2cb67d;
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(44, 182, 125, 0.3);
    }

    /* Стили для раскрывающегося отчета ИИ */
    .ai-report-toggle {
        cursor: pointer;
        color: #94a1b2;
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        background: rgba(127, 90, 240, 0.08);
        border-radius: 6px;
        transition: all 0.2s;
        user-select: none;
        margin-top: 4px;
    }
    .ai-report-toggle:hover {
        background: rgba(127, 90, 240, 0.15);
        color: #fffffe;
    }
    .ai-report-toggle .toggle-icon {
        transition: transform 0.3s ease;
        font-size: 0.7rem;
    }
    .ai-report-toggle.active .toggle-icon {
        transform: rotate(180deg);
    }

    .ai-report-content {
        display: none;
        background: #16161a;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #444b5a;
        font-size: 0.9rem;
        color: #94a1b2;
        line-height: 1.5;
        margin-top: 4px;
    }
    .ai-report-content.show {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .report-reason {
        color: #fffffe;
        font-weight: 500;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px dashed #444b5a;
        font-size: 0.85rem;
    }

    .btn-profile {
        padding: 6px 12px;
        font-size: 0.85rem;
        white-space: nowrap;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .node circle { transition: r 0.2s ease; }
    .node:hover circle { r: 12px; }
    .node text {
        fill: #94a1b2;
        font-size: 13px;
        pointer-events: none;
        user-select: none;
        font-family: 'Inter', system-ui, sans-serif;
    }
    line {
        stroke: #444b5a;
        stroke-opacity: 0.4;
        stroke-width: 1.5px;
    }
    .controls {
        position: absolute;
        top: 20px; right: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    #graphCanvas          { cursor: grab;    display: block; }
    #graphCanvas:active   { cursor: grabbing; }

    /* Модальное окно */
    #nodeModal {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 9999;
        align-items: center;
        justify-content: center;
    }
    .modal-box {
        background: #242629;
        padding: 24px;
        border-radius: 16px;
        width: 420px;
        max-width: 95vw;
        border: 1px solid #7f5af0;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        box-sizing: border-box;
    }
    .modal-box h2 {
        color: #fffffe;
        margin: 0 0 20px;
        font-family: sans-serif;
    }
    .modal-body { display: flex; flex-direction: column; gap: 12px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
</style>

<div class="app-main-grid graph-layout-active">
    <section class="app-main-grid__main">
        <div id="graph-wrapper" style="position: relative;">
            <div id="graph-container">
                <svg id="graphCanvas"
                     width="100%" height="617"
                     data-username="{{ current_user.username | e }}">
                </svg>
                <div class="controls">
                    <button class="btn-primary" onclick="window.addNode()">Создать узел</button>
                </div>
            </div>
        </div>
    </section>

    <aside class="app-main-grid__side" id="matchResultsSide">
        <div class="side-panel-header">
            <h3>Подходящие люди</h3>
            <span id="matchCount" class="badge">0</span>
        </div>
        <div class="ai-report-card" id="aiReportCard">
            <div class="ai-report-card__header">
                <span class="glow-dot"></span>
                ✨ Nexus AI
            </div>
            <div class="ai-report-card__preview" id="aiReportPreview">
                Выберите кандидата и откройте анализ совместимости
            </div>
        </div>
        <div id="resultsList" class="custom-scrollbar">
            <div class="placeholder-text">Нажмите на узел графа, чтобы найти единомышленников</div>
        </div>
    </aside>
</div>

<div id="nodeModal">
    <div class="modal-box">
        <h2 id="modalTitle">Новый интерес</h2>
        <div class="modal-body">
            <input type="text" id="nodeTitle" class="ui-input" placeholder="Название"
                   style="width:100%; box-sizing:border-box;">

            <textarea id="nodeDescription" class="ui-input" placeholder="Описание"
                      style="width:100%; box-sizing:border-box; resize:none; overflow:hidden; min-height:80px;"
                      oninput="this.style.height=''; this.style.height=this.scrollHeight+'px'"></textarea>

            <select id="nodeCategory" class="ui-input" style="width:100%; box-sizing:border-box;">
                <option value="hobby">Хобби</option>
                <option value="work">Работа</option>
                <option value="psychology">Психология</option>
            </select>

            <div class="modal-actions">
                <button onclick="window.saveNode()" class="btn-primary" style="flex:2; white-space:nowrap;">Сохранить
                </button>
                <button id="deleteBtn" onclick="window.deleteNode()" class="btn-primary"
                        style="background:#e53935; border-color:#b71c1c; flex:1; white-space:nowrap; display:none;">
                    Удалить
                </button>
                <button onclick="window.closeModal()" class="btn-primary"
                        style="background:#444; border-color:#555; flex:1; white-space:nowrap;">
                    Отмена
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    window._editingNodeId = null;

    // --- ФУНКЦИИ УПРАВЛЕНИЯ УЗЛАМИ ---
    window.addNode = function() {
        window._editingNodeId = null;
        document.getElementById('nodeTitle').value = '';
        document.getElementById('nodeDescription').value = '';
        document.getElementById('modalTitle').textContent = 'Новый интерес';
        document.getElementById('deleteBtn').style.display = 'none';
        document.getElementById('nodeModal').style.display = 'flex';
    };

    window.openEditModal = function(d) {
        window._editingNodeId = String(d.id);
        document.getElementById('nodeTitle').value = d.title || '';
        document.getElementById('nodeDescription').value = d.description || '';
        document.getElementById('nodeCategory').value = d.category || 'hobby';
        document.getElementById('modalTitle').textContent = 'Редактировать';
        document.getElementById('deleteBtn').style.display = 'block';
        document.getElementById('nodeModal').style.display = 'flex';
    };

    window.saveNode = async function() {
        const id = window._editingNodeId;
        const payload = {
            title: document.getElementById('nodeTitle').value,
            description: document.getElementById('nodeDescription').value,
            category: document.getElementById('nodeCategory').value,
            x: 0, y: 0
        };

        const url = id ? `/knowledge_graph/node/${id}` : '/knowledge_graph/node';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) location.reload();
    };

    window.deleteNode = async function() {
        const id = window._editingNodeId;
        if (!id) return;
        if (!confirm('Вы уверены, что хотите удалить этот интерес?')) return;

        try {
            const res = await fetch(`/knowledge_graph/node/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });

            if (res.ok) {
                window.closeModal();
                location.reload();
            } else {
                alert("Не удалось удалить узел. Ошибка сервера: " + res.status);
            }
        } catch (err) {
            alert("Ошибка при отправке запроса на удаление.");
        }
    };

    window.closeModal = () => document.getElementById('nodeModal').style.display = 'none';

    function _esc(str) {
        return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let _typewriterTimer = null;

    function typewriterRender(element, text, options = {}) {
        if (_typewriterTimer) {
            clearTimeout(_typewriterTimer);
            _typewriterTimer = null;
        }
        const safeText = String(text ?? '');
        const mode = options.mode || 'word';
        const delay = options.delay || (mode === 'char' ? 18 : 42);
        const showCursor = options.cursor !== false;

        element.textContent = '';
        if (!safeText) return;

        const units = mode === 'char'
            ? safeText.split('')
            : safeText.split(/(\s+)/);

        let index = 0;
        const cursor = document.createElement('span');
        cursor.className = 'tw-cursor';
        element.appendChild(cursor);

        const tick = () => {
            if (index >= units.length) {
                if (!showCursor) cursor.remove();
                return;
            }
            cursor.before(document.createTextNode(units[index]));
            index += 1;
            _typewriterTimer = setTimeout(tick, delay);
        };
        tick();
    }

    window.toggleReport = async function(element, targetUserId, nodeId) {
        element.classList.toggle('active');
        const content = element.nextElementSibling;
        content.classList.toggle('show');

        const textDiv = content.querySelector('.report-text');
        const sidebarCard = document.getElementById('aiReportCard');
        const sidebarPreview = document.getElementById('aiReportPreview');

        if (content.classList.contains('show') && !content.dataset.loaded) {
            const loadingHtml = '<span style="color: #2cb67d;">⚡ Анализируем совместимость...</span>';
            textDiv.innerHTML = loadingHtml;
            if (sidebarCard) sidebarCard.classList.add('visible');
            if (sidebarPreview) {
                sidebarPreview.textContent = '';
                sidebarPreview.appendChild(Object.assign(document.createElement('span'), {
                    textContent: '⚡ Анализируем совместимость...',
                    style: 'color: #2cb67d;',
                }));
            }

            try {
                const res = await fetch(`/api/graph/report/${targetUserId}?node_id=${nodeId}`);
                if (!res.ok) throw new Error("Server Error");

                const data = await res.json();
                const reportText = data.report
                    ? data.report
                    : 'Не удалось сформировать отчет.';

                textDiv.textContent = '';
                typewriterRender(textDiv, reportText, { mode: 'word', delay: 38 });

                if (sidebarPreview) {
                    typewriterRender(sidebarPreview, reportText, { mode: 'word', delay: 32 });
                }

                content.dataset.loaded = "true";
            } catch (err) {
                console.error("AI Report error:", err);
                const fallback = 'Ошибка связи с нейросетью. Показан базовый шаблон совместимости.';
                textDiv.textContent = '';
                typewriterRender(textDiv, fallback, { mode: 'word', delay: 30 });
                if (sidebarPreview) {
                    typewriterRender(sidebarPreview, fallback, { mode: 'word', delay: 28 });
                }
            }
        }
    };

    window.addEventListener('load', () => {
        const canvas = document.getElementById('graphCanvas');
        const userName = canvas.dataset.username || "Я";

        fetch('/knowledge_graph_data')
            .then(res => res.json())
            .then(data => {
                if (typeof initGraph === 'function') {
                    initGraph(data.nodes, data.connections, userName);
                }
            });

        // Основная функция поиска кандидатов
        window.onNodeClick = async function(nodeId) {
            const list = document.getElementById('resultsList');
            const badge = document.getElementById('matchCount');
            const sidebarCard = document.getElementById('aiReportCard');
            const sidebarPreview = document.getElementById('aiReportPreview');
            if (sidebarCard) sidebarCard.classList.remove('visible');
            if (sidebarPreview) sidebarPreview.textContent = 'Выберите кандидата и откройте анализ совместимости';
            list.innerHTML = '<div class="placeholder-text">Поиск в графе...</div>';

            try {
                // Запрашиваем только математический мэтчинг (теперь это будет мгновенно)
                const res = await fetch(`/api/graph/match/${nodeId}`);
                const data = await res.json();

                badge.textContent = data.length || 0;
                if (!data.length) {
                    list.innerHTML = '<div class="placeholder-text">Совпадений не найдено</div>';
                    return;
                }

                // Рендерим карточки
                list.innerHTML = data.map(m => {
                    const tagsHtml = (m.matched_tags && m.matched_tags.length > 0)
                        ? `<div class="match-tags">
                               ${m.matched_tags.map(tag => `<span class="match-tag">${_esc(tag)}</span>`).join('')}
                           </div>`
                        : '';

                    return `
                        <div class="match-card">
                            <div class="match-card-header">
                                <div class="match-score">${m.compatibility}%</div>
                                <div class="match-info">
                                    <div class="match-name">${_esc(m.user_name)}</div>
                                    ${(m.matched_tags && m.matched_tags.length > 0)
                                        ? `<div class="match-node">Совпадает: ${_esc(m.matched_tags[0])}</div>`
                                        : ''}
                                </div>
                                <button class="btn-primary" onclick="location.href='/viewProfile?user_id=${m.user_id}'">Профиль</button>
                            </div>

                            ${tagsHtml}

                            <div class="ai-report-toggle" onclick="toggleReport(this, ${m.user_id}, ${nodeId})">
                                <span class="toggle-text">Посмотреть анализ ИИ </span>
                                <span class="toggle-icon"> ▼</span>
                            </div>

                            <div class="ai-report-content">
                                <div class="report-reason"><strong>Почему:</strong> ${_esc(m.match_reason)}</div>
                                <div class="report-text">Ожидание запроса...</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                list.innerHTML = '<div class="placeholder-text" style="color: #e53935;">Ошибка поиска</div>';
            }
        };
    });
</script>
{% endblock %}
