{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 20px;">
    <div style="background: #393D54; border: 2px solid white; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; position: relative;">
        <!-- Фоновые изображения -->
        <img src="{{ url_for('static', filename='images/waves_3.svg') }}" alt=""
             style="position: absolute; top: -50px; right: -50px; height: 300px; width: 300px; opacity: 0.3; z-index: 0; pointer-events: none;">
        <img src="{{ url_for('static', filename='images/waves_2.svg') }}" alt=""
             style="position: absolute; bottom: -50px; left: -50px; height: 250px; width: 250px; opacity: 0.3; z-index: 0; pointer-events: none;">
        
        <div style="position: relative; z-index: 1;">
            <!-- Заголовок -->
            <div class="Text" style="font-weight: bold; font-size: 28px; text-align: center; color: white; margin-bottom: 20px;">
                {{interests.title}}
            </div>
            
            <!-- Описание интереса -->
            <div class="Preview"
                 style="margin-bottom: 24px; padding: 20px; background: #232533; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="Text" style="color: #d1d7dd; word-wrap: break-word; line-height: 1.6;">
                    {{interests.description}}
                </div>
            </div>
            
            <!-- Информация о пользователе -->
            <div style="text-align: center; margin-bottom: 16px;">
                <div class="Text" style="color: white; font-size: 18px; margin-bottom: 8px;">
                    Автор: <a href="/viewProfile?user_id={{ user.id }}" style="color: white; text-decoration: underline;">{{user.name}}</a>
                </div>
            </div>
            
            <!-- Контакты пользователя -->
            {% if user.connection %}
            <div class="Preview"
                 style="margin-bottom: 24px; padding: 20px; background: #232533; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="Text" style="color: #d1d7dd; word-wrap: break-word; line-height: 1.6;">
                    <strong style="color: white;">Контакты:</strong><br>
                    {{user.connection}}
                </div>
            </div>
            {% endif %}
            
            <!-- Кнопки действий -->
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                {% if current_user.is_authenticated and current_user.id != user.id %}
                <button id="writeButton" class="btn" style="padding: 12px 24px; border: 1px solid white; background: transparent; color: white; cursor: pointer; font-size: 16px; border-radius: 0;">
                    <div class="Text">Написать</div>
                </button>
                <button id="reportButton" class="btn" style="padding: 12px 24px; border: 1px solid #ff6b6b; background: transparent; color: #ff6b6b; cursor: pointer; font-size: 16px; border-radius: 0;">
                    <div class="Text">⚠️ Пожаловаться</div>
                </button>
                {% endif %}
                <a onclick="cancel()" style="text-decoration: none;">
                    <div class="btn" style="padding: 12px 24px; border: 1px solid white; background: transparent; color: white; cursor: pointer; font-size: 16px; border-radius: 0;">
                        <div class="Text">Назад</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    function cancel() {
        window.history.back();
    }

    {% if current_user.is_authenticated and current_user.id != user.id %}
    document.getElementById('writeButton').addEventListener('click', async function() {
        const userId = {{ user.id }};
        const button = this;
        button.disabled = true;
        button.innerHTML = '<div class="Text">Создание чата...</div>';
        
        try {
            const response = await fetch(`/create_chat/${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
            });
            
            const result = await response.json();
            
            if (result.success) {
                // Перенаправляем в чат с созданным/найденным чатом
                window.location.href = `/chat?chat_id=${result.chat_id}`;
            } else {
                alert(`Ошибка: ${result.message || 'Не удалось создать чат'}`);
                button.disabled = false;
                button.innerHTML = '<div class="Text">Написать</div>';
            }
        } catch (error) {
            console.error('Ошибка при создании чата:', error);
            alert('Произошла ошибка. Попробуйте ещё раз.');
            button.disabled = false;
            button.innerHTML = '<div class="Text">Написать</div>';
        }
    });
    
    document.getElementById('reportButton').addEventListener('click', function() {
        const reason = prompt('Причина жалобы:\n1 - Спам\n2 - Неприемлемый контент\n3 - Нарушение правил\n4 - Другое');
        if (!reason) return;
        
        const description = prompt('Опишите проблему:');
        if (!description) return;
        
        fetch(`/report/{{ interests.id }}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                reason: reason,
                description: description
            })
        }).then(res => res.json())
          .then(result => {
              if (result.success) {
                  alert('Жалоба отправлена. Спасибо за обратную связь!');
              } else {
                  alert(result.message || 'Ошибка при отправке жалобы');
              }
          })
          .catch(err => {
              console.error('Ошибка:', err);
              alert('Произошла ошибка. Попробуйте ещё раз.');
          });
    });
    {% endif %}
</script>
{% endblock %}
